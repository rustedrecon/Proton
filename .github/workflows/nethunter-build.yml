name: Build Proton+ NetHunter (AR9271)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Free up disk space and prepare tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          command -v python >/dev/null || sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Enable AR9271 (ath9k_htc) driver with built-in firmware
        run: |
          cat >> arch/arm64/configs/proton_defconfig <<'EOF'
          # NetHunter: AR9271 USB Wi-Fi (ath9k_htc) with built-in firmware
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_EXTRA_FIRMWARE="ath9k_htc/htc_9271-1.4.0.fw"
          CONFIG_EXTRA_FIRMWARE_DIR="firmware"
          EOF
          mkdir -p firmware/ath9k_htc
          FW=firmware/ath9k_htc/htc_9271-1.4.0.fw
          for url in \
            https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/ath9k_htc/htc_9271-1.4.0.fw \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw
          do
            curl -fL --retry 3 --connect-timeout 20 -o "$FW" "$url" || { rm -f "$FW"; continue; }
            if head -c 512 "$FW" | grep -qi "<html\|<!doctype"; then rm -f "$FW"; continue; fi
            break
          done
          if [ ! -s "$FW" ]; then
            echo "Mirrors failed, taking the firmware from Ubuntu's linux-firmware package"
            sudo apt-get update -q
            (cd /tmp && apt-get download linux-firmware)
            dpkg -x /tmp/linux-firmware_*.deb /tmp/lfw
            SRC=$(find /tmp/lfw -path "*ath9k_htc/htc_9271-1.4.0.fw*" | head -1)
            case "$SRC" in
              *.zst) zstd -d -o "$FW" "$SRC" ;;
              *.xz)  xz -dc "$SRC" > "$FW" ;;
              *)     cp "$SRC" "$FW" ;;
            esac
          fi
          test -s "$FW"
          ls -l firmware/ath9k_htc
          sha256sum "$FW"
          tail -8 arch/arm64/configs/proton_defconfig

      - name: Prepare Clang toolchain
        run: |
          AC_DIR="$(realpath "$PWD/..")/toolchains/aospclang"
          mkdir -p "$AC_DIR"
          ok=0
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r563880.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r563880.tar.gz"
          do
            if curl -fL --retry 3 -o /tmp/clang.tar.gz "$url" && tar -tzf /tmp/clang.tar.gz >/dev/null 2>&1; then
              tar -xzf /tmp/clang.tar.gz -C "$AC_DIR" && ok=1 && break
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "AOSP Clang not available, installing LLVM/Clang 20 from apt.llvm.org"
            rm -rf "$AC_DIR"; mkdir -p "$AC_DIR/bin"
            wget -q https://apt.llvm.org/llvm.sh && sudo bash llvm.sh 20
            for f in /usr/lib/llvm-20/bin/*; do ln -sf "$f" "$AC_DIR/bin/$(basename "$f")"; done
          fi
          touch "$AC_DIR/bin/aarch64-linux-gnu-elfedit" "$AC_DIR/bin/arm-linux-gnueabi-elfedit"
          chmod +x "$AC_DIR/bin/aarch64-linux-gnu-elfedit" "$AC_DIR/bin/arm-linux-gnueabi-elfedit"
          "$AC_DIR/bin/clang" --version
          "$AC_DIR/bin/ld.lld" --version

      - name: Build kernel
        run: |
          export WP="$(realpath "$PWD/..")"
          bash build/ckbuild.sh -cR

      - name: Check the driver made it into the build
        run: |
          grep -E "^CONFIG_(ATH9K_HTC|WLAN_VENDOR_ATH|EXTRA_FIRMWARE)=" out/.config

      - name: Upload Odin tar
        uses: actions/upload-artifact@v4
        with:
          name: ProtonPlus-NetHunter-odin-tar
          path: build/*.tar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: log.txt
